[project]
name = "aurafinity-app-starter"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "pydantic[email]>=2.10,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["."]
[tool.pytest.ini_options]
testpaths = ["tests"]
