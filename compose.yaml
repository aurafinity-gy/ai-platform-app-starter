services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starter"]
      interval: 3s
      retries: 20
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
  api:
    build: ./services/api-fastapi
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://starter:starter@db:5432/starter}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api
